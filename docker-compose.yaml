services:
  database:
    image: mysql:8.0
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME:-Portfolio}
      MYSQL_USER: ${MYSQL_USER:-StefanSpitse}
      MYSQL_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - database
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_DATABASE_PASSWORD}
    networks:
      - internal        # ✅ added

  backend:
    build:
      context: ./backend/StefanSpitse
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      MYSQL_DATABASE_NAME: ${MYSQL_DATABASE_NAME:-Portfolio}
      MYSQL_USER: ${MYSQL_USER:-StefanSpitse}
      MYSQL_DATABASE_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
      MYSQL_DATABASE_HOST: database
      MYSQL_DATABASE_PORT: 3306
    depends_on:         # ✅ fixed indentation
      - database
    networks:
      - internal        # ✅ added

  frontend:
    build:
      context: ./frontend/StefanSpitse
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://YOUR_SERVER_IP:8000   
    ports:
      - "80:80"         
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
