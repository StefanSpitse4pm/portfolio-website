services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - internal
  database:
    image: mysql:8.0
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME:-Portfolio}
      MYSQL_USER: ${MYSQL_USER:-StefanSpitse}
      MYSQL_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_DATABASE_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - database
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_DATABASE_PASSWORD}
    networks:
      - internal        

  backend:
    build:
      context: ./backend/StefanSpitse
      dockerfile: Dockerfile
    environment:
      ALEMBIC_URI: ${ALEMBIC_URI}
      MYSQL_DATABASE_URI: ${MYSQL_DATABASE_URI}
      MYSQL_DATABASE_NAME: ${MYSQL_DATABASE_NAME:-Portfolio}
      MYSQL_USER: ${MYSQL_USER:-StefanSpitse}
      MYSQL_DATABASE_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
      MYSQL_DATABASE_HOST: database
      MYSQL_DATABASE_PORT: 3306
      JWT_SECRET_KEY: ${JWT_SECRET_KEY} 
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal        

  frontend:
    build:
      context: ./frontend/StefanSpitse
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL}
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
