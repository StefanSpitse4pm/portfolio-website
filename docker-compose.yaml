services:
    database:
      image: mysql:8.0
      container_name: database
      ports:
        - "3306:3306"
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
        MYSQL_DATABASE: ${MYSQL_DATABASE_NAME:-Portfolio}
        MYSQL_USER: ${MYSQL_USER:-StefanSpitse}
        MYSQL_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
      volumes:
        - ./Portfolio.sql:/docker-entrypoint-initdb.d/Portfolio.sql:ro
    phpmyadmin:
      image: phpmyadmin/phpmyadmin:latest
      container_name: phpmyadmin
      ports:
        - "8080:80"
      environment:
        PMA_HOST: database 
        PMA_PORT: 3306
        PMA_USER: root 
        PMA_PASSWORD: ${MYSQL_DATABASE_PASSWORD}
    backend:
      build:
        context: ./backend/StefanSpitse
        dockerfile: Dockerfile
      ports:
        - "8000:80"
      environment:
        MYSQL_DATABASE_NAME: ${MYSQL_DATABASE_NAME:-StefanSpitse}
        MYSQL_USER: ${MYSQL_USER:-StefanSpitse}
        MYSQL_DATABASE_PASSWORD: ${MYSQL_DATABASE_PASSWORD:?Set MYSQL_DATABASE_PASSWORD in your environment}
        MYSQL_DATABASE_HOST: database
        MYSQL_DATABASE_PORT: 3306
      volumes:
        - ./backend/StefanSpitse/src/:/app/src
    frontend:
      build:
        context: ./frontend/StefanSpitse
        dockerfile: Dockerfile
      ports:
        - "5173:5173"
      environment:
        VITE_API_URL: http://localhost:8000
      volumes:
        - ./frontend/StefanSpitse:/app
      
      
